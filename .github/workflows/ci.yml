name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Luau + JS
        run: node pipeline/bridge.js verify

      - name: Smoke — full offline end-to-end (prompt -> spec -> config -> verify)
        run: node pipeline/bridge.js smoke
