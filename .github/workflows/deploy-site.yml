name: Deploy site to GitHub Pages

# Builds nothing — site/ is pure HTML/CSS/JS. Every push to main redeploys
# the RBLX Operator landing page at:
#   https://meharbsinghs.github.io/RBLX_OPERATOR-/
# The workflow regenerates the favicon from the committed logo first so the
# site always ships the current mark.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate favicon from current logo
        run: |
          node pipeline/build_icon.js
          cp assets/branding/icon.ico site/favicon.ico
          cp assets/branding/logo.png site/logo.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
