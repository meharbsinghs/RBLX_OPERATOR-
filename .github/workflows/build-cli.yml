name: Build CLI

# Packages the RBLX Operator CLI + engine as a downloadable zip:
#   - on every push to main: rblx-operator-cli.zip + the Studio plugin are
#     attached to the rolling 'continuous' release — the website's download
#     links always point here and always resolve to the newest build
#     (assets overwritten each push).
#   - on a v* tag (e.g. git tag v1.0.0): attached to a versioned GitHub Release
#     with generated release notes.
#   - manually any time via the "Run workflow" button on the Actions tab.
#
# Uses the gh CLI (preinstalled on runners) with explicit exit codes.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate icon assets (logo.png -> icon.ico)
        run: node pipeline/build_icon.js

      - name: Validate engine (Luau + JS) before packaging
        run: node pipeline/bridge.js verify

      - name: Regenerate ASCII banner asset
        run: node pipeline/ascii_banner.js --cols 84 --save assets/branding/banner.txt

      - name: Package CLI zip (whole engine, no .git)
        run: |
          mkdir -p dist
          git archive --format=zip -o dist/rblx-operator-cli.zip HEAD
          cp plugin/RBLXOperatorCraft.luau dist/rblx-operator-plugin.luau
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rblx-operator-cli
          path: |
            dist/rblx-operator-cli.zip
            dist/rblx-operator-plugin.luau
          if-no-files-found: error

      - name: Publish rolling release (every push to main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "[release] publishing rolling assets"
          gh release view continuous > /dev/null 2>&1 || gh release create continuous \
            --title "RBLX Operator — continuous build" \
            --notes "Automated build from main. These assets are overwritten on every push, so this release always holds the newest build." > /dev/null
          gh release upload continuous dist/rblx-operator-cli.zip dist/rblx-operator-plugin.luau --clobber
          echo "[release] assets uploaded"
          id=$(gh release view continuous --json id -q .id)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f make_latest=true > /dev/null
          echo "[release] marked latest — done"

      - name: Publish versioned release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="$GITHUB_REF_NAME"
          echo "[release] publishing versioned release $tag"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/rblx-operator-cli.zip dist/rblx-operator-plugin.luau --clobber
          else
            gh release create "$tag" --generate-notes \
              dist/rblx-operator-cli.zip dist/rblx-operator-plugin.luau
          fi
          echo "[release] versioned release done"
