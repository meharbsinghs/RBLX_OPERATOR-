name: Build EXE

# Produces the downloadable Windows desktop app (RBLX Operator Studio):
#   - on every push to main: the .exe files are attached to the rolling
#     'continuous' release — the website's download links always point here
#     and always resolve to the newest build (assets overwritten each push).
#   - on a v* tag (e.g. git tag v1.0.0): attached to a versioned GitHub Release
#     with generated release notes.
#   - manually any time via the "Run workflow" button on the Actions tab.
#
# Uses the gh CLI (preinstalled on runners) instead of softprops/action-gh-release
# because softprops resolves file globs relative to the workspace root and
# silently misses app/dist/ files on Windows.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate icon assets (logo.png -> icon.ico)
        run: node pipeline/build_icon.js

      - name: Validate engine (Luau + JS) before packaging
        run: node pipeline/bridge.js verify

      - name: Install desktop app dependencies
        working-directory: app
        run: npm install

      - name: Build Windows EXE (installer + portable)
        working-directory: app
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Normalize release asset names
        shell: pwsh
        run: |
          # electron-builder outputs 'RBLX-Operator-Setup-1.0.0.exe' (hyphens).
          # Match by '*Setup*' / non-setup so naming changes never break us.
          Get-ChildItem app/dist/*.exe | Where-Object { $_.Name -like "*Setup*" } | Select-Object -First 1 | Copy-Item -Destination "app/dist/rblx-operator-setup.exe" -Force
          Get-ChildItem app/dist/*.exe | Where-Object { $_.Name -notlike "*Setup*" } | Select-Object -First 1 | Copy-Item -Destination "app/dist/rblx-operator-portable.exe" -Force
          Copy-Item "plugin/RBLXOperatorCraft.luau" "app/dist/rblx-operator-plugin.luau" -Force
          Get-ChildItem app/dist/*.exe, app/dist/*.luau | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rblx-operator-windows
          path: |
            app/dist/*.exe
            app/dist/*.luau
          if-no-files-found: error

      - name: Publish rolling release (every push to main)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view continuous *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[release] continuous not found — creating"
            gh release create continuous --title "RBLX Operator — continuous build" --notes "Automated build from main. These assets are overwritten on every push, so this release always holds the newest build." *> $null
            if ($LASTEXITCODE -ne 0) { Write-Host "[release] create failed"; exit $LASTEXITCODE }
          } else {
            Write-Host "[release] continuous exists — updating assets"
          }
          gh release upload continuous app/dist/rblx-operator-setup.exe app/dist/rblx-operator-portable.exe app/dist/rblx-operator-plugin.luau --clobber
          if ($LASTEXITCODE -ne 0) { Write-Host "[release] upload failed"; exit $LASTEXITCODE }
          Write-Host "[release] assets uploaded"
          $id = (gh release view continuous --json id -q .id 2>$null | Out-String).Trim()
          if ($id) {
            gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/releases/$id" -f make_latest=true *> $null
            Write-Host "[release] marked latest"
          }
          Write-Host "[release] done"
          exit 0

      - name: Publish versioned release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          Write-Host "[release] publishing versioned release $tag"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --generate-notes app/dist/rblx-operator-setup.exe app/dist/rblx-operator-portable.exe app/dist/rblx-operator-plugin.luau
            if ($LASTEXITCODE -ne 0) { Write-Host "[release] create failed"; exit $LASTEXITCODE }
          } else {
            gh release upload $tag app/dist/rblx-operator-setup.exe app/dist/rblx-operator-portable.exe app/dist/rblx-operator-plugin.luau --clobber
            if ($LASTEXITCODE -ne 0) { Write-Host "[release] upload failed"; exit $LASTEXITCODE }
          }
          Write-Host "[release] done"
          exit 0
