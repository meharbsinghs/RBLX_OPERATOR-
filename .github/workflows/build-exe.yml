name: Build EXE

# Produces the downloadable Windows desktop app (RBLX Operator Studio):
#   - on every push to main: the .exe files are uploaded as a workflow Artifact
#   - on a v* tag (e.g. git tag v1.0.0): attached to a GitHub Release
#   - manually any time via the "Run workflow" button on the Actions tab

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate icon assets (logo.png -> icon.ico)
        run: node pipeline/build_icon.js

      - name: Validate engine (Luau + JS) before packaging
        run: node pipeline/bridge.js verify

      - name: Install desktop app dependencies
        working-directory: app
        run: npm install

      - name: Build Windows EXE (installer + portable)
        working-directory: app
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rblx-operator-windows
          path: |
            app/dist/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/*.exe
          generate_release_notes: true
