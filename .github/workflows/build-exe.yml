name: Build EXE

# Produces the downloadable Windows desktop app (RBLX Operator Studio):
#   - on every push to main: the .exe files are attached to the rolling
#     'continuous' release — the website's download links always point here
#     and always resolve to the newest build (assets overwritten each push).
#   - on a v* tag (e.g. git tag v1.0.0): attached to a versioned GitHub Release
#     with generated release notes.
#   - manually any time via the "Run workflow" button on the Actions tab.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate icon assets (logo.png -> icon.ico)
        run: node pipeline/build_icon.js

      - name: Validate engine (Luau + JS) before packaging
        run: node pipeline/bridge.js verify

      - name: Install desktop app dependencies
        working-directory: app
        run: npm install

      - name: Build Windows EXE (installer + portable)
        working-directory: app
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Normalize EXE names for stable download links
        working-directory: app/dist
        shell: pwsh
        run: |
          Get-ChildItem "RBLX Operator Setup *.exe" | Select-Object -First 1 | Copy-Item -Destination "rblx-operator-setup.exe" -Force
          Get-ChildItem "RBLX Operator *.exe" | Where-Object { $_.Name -notlike "*Setup*" } | Select-Object -First 1 | Copy-Item -Destination "rblx-operator-portable.exe" -Force
          Get-ChildItem *.exe | Select-Object Name, Length

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rblx-operator-windows
          path: |
            app/dist/*.exe
          if-no-files-found: error

      - name: Publish to rolling release (every push to main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: "RBLX Operator — continuous build"
          body: |
            Automated build from `main`. These assets are overwritten on every
            push, so this release always holds the newest build. The website's
            download buttons link here:
            - `rblx-operator-setup.exe` — installer
            - `rblx-operator-portable.exe` — portable, no install
          files: |
            app/dist/rblx-operator-setup.exe
            app/dist/rblx-operator-portable.exe
          allowUpdates: true
          update_release_body: true
          make_latest: true
          draft: false
          prerelease: false

      - name: Attach to versioned release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/dist/rblx-operator-setup.exe
            app/dist/rblx-operator-portable.exe
          generate_release_notes: true
